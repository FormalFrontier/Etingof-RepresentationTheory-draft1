name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The full project is rebuilt from scratch every run (use-github-cache:
    # false, so no project-olean cache). As Chapter5 has grown, that cold
    # build now needs more than the previous 60-minute budget: runs were
    # reaching 8337/8339 modules and then dying on the job wall (SIGTERM
    # 143). Raised to 120 min to keep full module coverage with headroom
    # for near-term growth instead of excluding more theorems from CI.
    timeout-minutes: 120
    steps:
      - name: Add swap space
        uses: actionhippie/swap-space@v1
        with:
          size: 8G
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
      - name: Build modules
        run: |
          # v4.31 port stacks are intentionally not full-repo green until all
          # repairs land. Validate only the modules touched by each stacked PR.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              git fetch --no-tags --depth=1 origin "$BASE"
            else
              BASE_REF="${PORT_BASE_REF:-stack/toolchain-v4.31.0}"
              git fetch --no-tags --depth=1 origin "$BASE_REF"
              BASE="origin/$BASE_REF"
            fi

            mapfile -t FILES < <(
              git diff --name-only "$BASE"...HEAD -- 'EtingofRepresentationTheory/**/*.lean' |
                sort -u
            )

            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "No changed Lean modules to build."
              exit 0
            fi

            TARGETS=()
            for FILE in "${FILES[@]}"; do
              MODULE="${FILE%.lean}"
              TARGETS+=("${MODULE//\//.}")
            done

            printf 'Building changed module: %s\n' "${TARGETS[@]}"
            lake build "${TARGETS[@]}"
            exit 0
          fi

          # Build individual modules, excluding:
          # - Chapter/root aggregation files (mindepth 2 skips these)
          # - Modules that import full Mathlib + large chapter environments,
          #   which require >15GB to compile (exceeds runner capacity)
          EXCLUDE="SpechtModuleSimple|YoungSymTraceKronecker|FrobeniusCharacterBridge|Proposition5_22_2|Example6_4_9_EType|Example6_4_9\.lean"
          find EtingofRepresentationTheory -mindepth 2 -name '*.lean' \
            | grep -vE "$EXCLUDE" \
            | sed 's|/|.|g; s|\.lean$||' \
            | xargs lake build
