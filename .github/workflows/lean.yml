name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The full project is rebuilt from scratch every run (use-github-cache:
    # false, so no project-olean cache). As Chapter5 has grown, that cold
    # build now needs more than the previous 60-minute budget: runs were
    # reaching 8337/8339 modules and then dying on the job wall (SIGTERM
    # 143). Raised to 120 min to keep full module coverage with headroom
    # for near-term growth instead of excluding more theorems from CI.
    timeout-minutes: 120
    steps:
      - name: Add swap space
        uses: actionhippie/swap-space@v1
        with:
          size: 8G
      - uses: actions/checkout@v5
      - name: Classify proof placeholders
        run: |
          set -o pipefail
          python3 scripts/test_check_proof_placeholders.py
          scripts/check_proof_placeholders.py
          python3 scripts/validate_items.py | tail -4
      - name: Forbid native_decide (trust-hole guard)
        run: |
          # native_decide compiles the goal to native code and trusts the Lean
          # compiler + runtime — it is outside the kernel, so every use is an
          # unverified assertion. It is FORBIDDEN in this project. Fail fast (before
          # the long build) on any genuine native_decide tactic use or linter
          # disable. The filter mirrors the project's "tight" metric so prose/
          # docstring mentions ("we avoid native_decide") do not trip the guard.
          hits=$(git grep -nE '(^|[^-A-Za-z.])native_decide([^A-Za-z]|$)' -- 'EtingofRepresentationTheory/**/*.lean' \
            | grep -vE ':[0-9]+:[[:space:]]*(--|/-|\*)' \
            | grep -vE '`native_decide`|no native_decide|not .*native_decide|honest.*decide|SOS bounds . native' || true)
          disables=$(git grep -nE 'set_option[[:space:]]+linter\.style\.nativeDecide[[:space:]]+false' -- 'EtingofRepresentationTheory/**/*.lean' || true)
          if [ -n "$hits" ] || [ -n "$disables" ]; then
            echo "::error::FORBIDDEN native_decide / linter.style.nativeDecide disable found — replace with an honest proof:"
            [ -n "$hits" ] && echo "$hits"
            [ -n "$disables" ] && echo "$disables"
            exit 1
          fi
          echo "OK: no native_decide in EtingofRepresentationTheory."
      - name: Validate source and exercise ledgers
        run: |
          # Keep the source partition, durable claim ledger, and human summary
          # mechanically synchronized. These checks are intentionally ahead of
          # the expensive Lean build so metadata drift fails fast.
          python3 scripts/validate_items.py
          python3 scripts/verify_blobs.py
          python3 scripts/reconcile_exercise_coverage.py --check
          python3 scripts/validate_exercise_coverage.py
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false
      - name: Build all modules
        run: |
          set -o pipefail
          # This generated module imports the public project environment and
          # asks Lean to resolve every declaration pointer in the exercise
          # claim ledger. It lives at repository-root depth and is therefore
          # built explicitly before the per-file sweep below.
          lake build EtingofRepresentationTheory.ExerciseCoverageDeclarations
          # Build individual modules, excluding:
          # - Chapter/root aggregation files (mindepth 2 skips these)
          # - Modules that import full Mathlib + large chapter environments,
          #   which require >15GB to compile (exceeds runner capacity)
          EXCLUDE="SpechtModuleSimple|SpechtCharacterGeneral|YoungSymTraceKronecker|FrobeniusCharacterBridge|Proposition5_22_2|Example6_4_9_EType|Example6_4_9\.lean"
          find EtingofRepresentationTheory -mindepth 2 -name '*.lean' \
            | grep -vE "$EXCLUDE" \
            | sed 's|/|.|g; s|\.lean$||' \
            > "$RUNNER_TEMP/modules.txt"
          # Keep the log: the lint-clean check below reads warnings out of it
          # rather than paying for a second build.
          xargs lake build < "$RUNNER_TEMP/modules.txt" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: No new build warnings
        run: |
          # `lake build` exits 0 on warnings, so without this step nothing
          # enforces the project's lint-clean policy. The check ratchets against
          # scripts/lint-warning-baseline.txt: a file not on that list must build
          # warning-free, and a listed file that has since been cleaned has to be
          # dropped from the list.
          scripts/check_lint_clean.py \
            --log "$RUNNER_TEMP/build.log" \
            --modules "$RUNNER_TEMP/modules.txt"
