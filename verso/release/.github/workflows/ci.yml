name: Private Verso CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap the generated Lake manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - name: Restore the pinned formalization build
        id: formalization-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/RepresentationTheoryFormalization/.lake/build
          key: formalization-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
      - name: Build the pinned formalization
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          build-args: "@RepresentationTheoryFormalization"
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check the formalization build cache
        run: test -f .lake/packages/RepresentationTheoryFormalization/.lake/build/lib/lean/RepresentationTheory.olean
      - name: Save the pinned formalization build
        if: steps.formalization-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .lake/packages/RepresentationTheoryFormalization/.lake/build
          key: formalization-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

  build:
    if: ${{ always() }}
    needs: formalization
    runs-on: ubuntu-latest
    steps:
      - name: Require the pinned formalization build
        if: ${{ needs.formalization.result != 'success' }}
        run: |
          echo "The pinned formalization job did not succeed." >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Bootstrap the generated Lake manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - name: Restore the pinned formalization build
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages/RepresentationTheoryFormalization/.lake/build
          key: formalization-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          fail-on-cache-miss: true
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check formalization panels against the pinned public revision
        run: |
          lake env lean --run AlignmentExport.lean > "$RUNNER_TEMP/formalization-alignment.json"
          python3 scripts/sync_formalization_panels.py --check "$RUNNER_TEMP/formalization-alignment.json"
      - name: Render the private multi-page book
        run: python3 scripts/build_site.py
      - name: Check private legal filenames
        run: |
          test -f LICENCE
          test ! -e LICENSE
      - name: Upload access-controlled site artifact
        uses: actions/upload-artifact@v4
        with:
          name: etingof-representation-theory-verso-${{ github.sha }}
          path: _out/html-multi
          if-no-files-found: error
          retention-days: 14
