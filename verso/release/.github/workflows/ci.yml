name: Private Verso CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORMALIZATION_REPO: mathlib-initiative/EtingofRepresentationTheory
  FORMALIZATION_RELEASE: formalization-cache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Reclaim hosted-runner disk space
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android
          sudo rm -rf -- /usr/share/dotnet
          sudo rm -rf -- /opt/ghc
          sudo rm -rf -- /usr/local/.ghcup
          sudo rm -rf -- /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap the generated Lake manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      # The pinned formalization is built once by the public repository and
      # published as a Lake artifact cache payload. Loading it here lets Lake
      # replay the pinned oleans instead of recompiling ~800 modules, which no
      # hosted runner can do within its time limit.
      - name: Resolve the pinned formalization revision
        id: pin
        run: |
          revision="$(python3 - <<'PY'
          import pathlib
          import tomllib

          config = tomllib.loads(pathlib.Path("lakefile.toml").read_text(encoding="utf-8"))
          pins = [
              require.get("rev")
              for require in config.get("require", [])
              if require.get("name") == "RepresentationTheoryFormalization"
          ]
          if len(pins) != 1 or not pins[0]:
              raise SystemExit(
                  "lakefile.toml must pin RepresentationTheoryFormalization to exactly one revision"
              )
          print(pins[0])
          PY
          )"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Pinned formalization revision: $revision"
      - name: Download the pinned formalization artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          asset="formalization-$REVISION.tar.gz"
          if ! gh release download "$FORMALIZATION_RELEASE" \
              --repo "$FORMALIZATION_REPO" \
              --pattern "$asset" \
              --pattern "$asset.sha256" \
              --dir "$RUNNER_TEMP"; then
            echo "::error::No published artifact cache for pinned revision $REVISION."
            echo "The pin in lakefile.toml and the artifacts published by" >&2
            echo "$FORMALIZATION_REPO are out of sync. Re-run Lean CI on that" >&2
            echo "revision, or repin to a revision whose assets exist." >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          sha256sum --check "$asset.sha256"
          ls -l "$asset"
      - name: Load the pinned formalization into the Lake cache
        env:
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          archive="$RUNNER_TEMP/formalization-$REVISION.tar.gz"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          seen = set()
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit(f"empty artifact archive: {archive}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  if not path.parts or path.parts[0] != "staging":
                      raise SystemExit(f"archive member outside staging/: {member.name!r}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported archive member type: {member.name!r}")
                  if member.name in seen:
                      raise SystemExit(f"duplicate archive member: {member.name!r}")
                  seen.add(member.name)
          PY
          mkdir -p "$RUNNER_TEMP/formalization-cache"
          test -z "$(find "$RUNNER_TEMP/formalization-cache" -mindepth 1 -print -quit)"
          tar --extract --gzip \
            --file "$archive" \
            --directory "$RUNNER_TEMP/formalization-cache" \
            --no-same-owner --no-same-permissions
          lake cache unstage "$RUNNER_TEMP/formalization-cache/staging"
      # Asserted before the build below: afterwards every target is up to date
      # whether it was replayed or recompiled, so the check would be vacuous.
      - name: Verify the pinned formalization was replayed, not rebuilt
        run: lake --no-build build @RepresentationTheoryFormalization
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Check formalization panels against the pinned public revision
        run: |
          lake env lean --run AlignmentExport.lean > "$RUNNER_TEMP/formalization-alignment.json"
          python3 scripts/sync_formalization_panels.py --check "$RUNNER_TEMP/formalization-alignment.json"
      - name: Render the private multi-page book
        run: python3 scripts/build_site.py
      - name: Check private legal filenames
        run: |
          test -f LICENSE
          test ! -e LICENCE
      - name: Upload access-controlled site artifact
        uses: actions/upload-artifact@v4
        with:
          name: etingof-representation-theory-verso-${{ github.sha }}
          path: _out/html-multi
          if-no-files-found: error
          retention-days: 14
