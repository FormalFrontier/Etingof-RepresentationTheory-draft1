name: Update formalization dependency

on:
  repository_dispatch:
    types: [formalization-updated]

permissions:
  contents: read

# Public revisions can finish CI out of order. Serializing dependency updates and
# cancelling a superseded one keeps a slower older revision from landing after a
# newer one and regressing the pin.
concurrency:
  group: update-formalization
  cancel-in-progress: true

env:
  FORMALIZATION_REPO: mathlib-initiative/EtingofRepresentationTheory
  FORMALIZATION_RELEASE_PREFIX: formalization-cache-

jobs:
  prepare_update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Reclaim hosted-runner disk space
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android
          sudo rm -rf -- /usr/share/dotnet
          sudo rm -rf -- /opt/ghc
          sudo rm -rf -- /usr/local/.ghcup
          sudo rm -rf -- /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the dispatched public revision
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.client_payload.sha }}
        run: |
          python3 - "$REVISION" <<'PY'
          import re
          import sys

          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) is None:
              raise SystemExit("dispatched formalization revision is not exact lowercase 40-hex")
          PY
          current_main=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/heads/main" \
            --jq .object.sha)
          if test "$REVISION" != "$current_main"; then
            echo "::error::Refusing stale revision $REVISION; public main is $current_main."
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Update the pinned public revision and bootstrap Lake
        env:
          FORMALIZATION_SHA: ${{ steps.revision.outputs.revision }}
        run: |
          python3 scripts/update_formalization_dependency.py "$FORMALIZATION_SHA"
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      # The dispatching revision has already been built and published by the
      # public repository, so this job replays its artifact cache payload rather
      # than recompiling ~800 modules.
      - name: Download the updated formalization artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          release="$FORMALIZATION_RELEASE_PREFIX$REVISION"
          asset="formalization-$REVISION.tar.gz"
          sidecar="$asset.sha256"
          tag_type=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/tags/$release" \
            --jq .object.type)
          tag_sha=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/tags/$release" \
            --jq .object.sha)
          if test "$tag_type" != commit || test "$tag_sha" != "$REVISION"; then
            echo "::error::Artifact release $release is not bound to revision $REVISION."
            exit 1
          fi
          if test -e "$RUNNER_TEMP/$asset" || test -e "$RUNNER_TEMP/$sidecar"; then
            echo "::error::Refusing to reuse pre-existing artifact download paths."
            exit 1
          fi
          if ! gh release download "$release" \
              --repo "$FORMALIZATION_REPO" \
              --pattern "$asset" \
              --pattern "$sidecar" \
              --dir "$RUNNER_TEMP"; then
            echo "::error::No published artifact cache for dispatched revision $REVISION."
            echo "Lean CI on $FORMALIZATION_REPO must publish that revision before" >&2
            echo "the dependency update can be prepared." >&2
            exit 1
          fi
          cd "$RUNNER_TEMP"
          if ! { test -f "$asset" && test ! -L "$asset" &&
                 test -f "$sidecar" && test ! -L "$sidecar"; }; then
            echo "::error::Downloaded artifact pair is incomplete or not regular files."
            exit 1
          fi
          python3 - "$sidecar" "$asset" <<'PY'
          import re
          import sys
          from pathlib import Path

          sidecar, asset = sys.argv[1:]
          contents = Path(sidecar).read_text(encoding="ascii")
          if re.fullmatch(rf"[0-9a-f]{{64}}  {re.escape(asset)}\n", contents) is None:
              raise SystemExit(f"noncanonical checksum sidecar: {sidecar}")
          PY
          sha256sum --check --strict "$sidecar"
          ls -l "$asset"
      - name: Load the updated formalization into the Lake cache
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          archive="$RUNNER_TEMP/formalization-$REVISION.tar.gz"
          python3 - "$archive" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          seen = set()
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit(f"empty artifact archive: {archive}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  if not path.parts or path.parts[0] != "staging":
                      raise SystemExit(f"archive member outside staging/: {member.name!r}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported archive member type: {member.name!r}")
                  if member.name in seen:
                      raise SystemExit(f"duplicate archive member: {member.name!r}")
                  seen.add(member.name)
          PY
          mkdir -p "$RUNNER_TEMP/formalization-cache"
          test -z "$(find "$RUNNER_TEMP/formalization-cache" -mindepth 1 -print -quit)"
          tar --extract --gzip \
            --file "$archive" \
            --directory "$RUNNER_TEMP/formalization-cache" \
            --no-same-owner --no-same-permissions
          lake cache unstage "$RUNNER_TEMP/formalization-cache/staging"
      # Asserted before the build below: afterwards every target is up to date
      # whether it was replayed or recompiled, so the check would be vacuous.
      - name: Verify the updated formalization was replayed, not rebuilt
        run: lake --no-build build @RepresentationTheoryFormalization
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Synchronize formalization panels
        run: |
          lake env lean --run AlignmentExport.lean > "$RUNNER_TEMP/formalization-alignment.json"
          python3 scripts/sync_formalization_panels.py "$RUNNER_TEMP/formalization-alignment.json"
      - name: Validate and package the dependency update
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          prefix = b"IntroductionToRepresentationTheoryVerso/Content/"
          raw = subprocess.check_output(["git", "diff", "--name-only", "-z"])
          paths = [path for path in raw.split(b"\0") if path]
          unexpected = [
              os.fsdecode(path)
              for path in paths
              if not (path == b"lakefile.toml" or (path.startswith(prefix) and path.endswith(b".lean")))
          ]
          if unexpected:
              raise SystemExit(f"unexpected dependency-update paths: {unexpected}")
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode:
              raise SystemExit("dependency preparation unexpectedly changed the Git index")
          for raw_path in paths:
              path = os.fsdecode(raw_path)
              if os.path.islink(path) or not os.path.isfile(path):
                  raise SystemExit(f"dependency update is not a regular file modification: {path}")
          subprocess.run(["git", "diff", "--check"], check=True)
          summary = subprocess.check_output(["git", "diff", "--summary"])
          if summary:
              raise SystemExit("dependency update contains a create/delete/rename/mode change:\n" + summary.decode())
          PY
          git diff --binary --full-index -- \
            lakefile.toml \
            IntroductionToRepresentationTheoryVerso/Content \
            > "$RUNNER_TEMP/formalization-update.patch"
      - name: Upload the validated dependency update
        uses: actions/upload-artifact@v4
        with:
          name: formalization-update-${{ github.run_id }}
          path: ${{ runner.temp }}/formalization-update.patch
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  update:
    if: ${{ always() }}
    needs: prepare_update
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Require a validated dependency update
        if: ${{ needs.prepare_update.result != 'success' }}
        run: |
          echo "The dependency update preparation job did not succeed." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Revalidate current public main before privileged update
        id: privileged_revision
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.event.client_payload.sha }}
        run: |
          python3 - "$REVISION" <<'PY'
          import re
          import sys

          if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) is None:
              raise SystemExit("dispatched formalization revision is not exact lowercase 40-hex")
          PY
          current_main=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/heads/main" \
            --jq .object.sha)
          if test "$REVISION" != "$current_main"; then
            echo "::error::Refusing stale revision $REVISION; public main is $current_main."
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Download the validated dependency update
        uses: actions/download-artifact@v4
        with:
          name: formalization-update-${{ github.run_id }}
          path: ${{ runner.temp }}/formalization-update
      - name: Apply and revalidate the dependency update
        env:
          FORMALIZATION_SHA: ${{ steps.privileged_revision.outputs.revision }}
        run: |
          patch="$RUNNER_TEMP/formalization-update/formalization-update.patch"
          test -f "$patch"
          if test -s "$patch"; then
            git apply --index --whitespace=error-all "$patch"
          fi
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          prefix = b"IntroductionToRepresentationTheoryVerso/Content/"
          raw = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"])
          paths = [path for path in raw.split(b"\0") if path]
          unexpected = [
              os.fsdecode(path)
              for path in paths
              if not (path == b"lakefile.toml" or (path.startswith(prefix) and path.endswith(b".lean")))
          ]
          if unexpected:
              raise SystemExit(f"unexpected staged dependency-update paths: {unexpected}")
          for raw_path in paths:
              path = os.fsdecode(raw_path)
              if os.path.islink(path) or not os.path.isfile(path):
                  raise SystemExit(f"staged dependency update is not a regular file modification: {path}")
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          summary = subprocess.check_output(["git", "diff", "--cached", "--summary"])
          if summary:
              raise SystemExit("staged update contains a create/delete/rename/mode change:\n" + summary.decode())

          sha = os.environ["FORMALIZATION_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("dispatched formalization SHA is not canonical")
          stanza = re.compile(
              r'(\[\[require\]\]\nname = "RepresentationTheoryFormalization"\n'
              r'git = "[^"\n]+"\nrev = ")[^"\n]+("\n)'
          )
          base = subprocess.check_output(["git", "show", "HEAD:lakefile.toml"]).decode("utf-8")
          expected, count = stanza.subn(lambda match: match.group(1) + sha + match.group(2), base)
          if count != 1:
              raise SystemExit("base lakefile does not contain exactly one canonical formalization stanza")
          if Path("lakefile.toml").read_text(encoding="utf-8") != expected:
              raise SystemExit("staged lakefile is not the exact canonical dispatched-SHA update")
          PY
      - name: Create or refresh dependency update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FORMALIZATION_SHA: ${{ steps.privileged_revision.outputs.revision }}
          SOURCE_REF: ${{ github.event.client_payload.ref }}
        run: |
          current_public_main=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/heads/main" \
            --jq .object.sha)
          if test "$FORMALIZATION_SHA" != "$current_public_main"; then
            echo "::error::Public main advanced to $current_public_main before publication."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "The requested formalization revision is already pinned."
            exit 0
          fi
          gh auth setup-git --hostname github.com --force
          branch="automation/formalization-${FORMALIZATION_SHA:0:12}"
          lease="refs/heads/$branch:"
          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          remote_sha=${remote_ref%%[[:space:]]*}
          if [ -n "$remote_sha" ]; then
            git fetch --no-tags origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"
            remote_sha=$(git rev-parse "refs/remotes/origin/$branch")
            lease="refs/heads/$branch:$remote_sha"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update formalization to ${FORMALIZATION_SHA:0:12}"
          head_sha=$(git rev-parse HEAD)
          git push --force-with-lease="$lease" origin "HEAD:refs/heads/$branch"
          pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Update formalization to ${FORMALIZATION_SHA:0:12}" \
              --body "Pins mathlib-initiative/EtingofRepresentationTheory at \`${FORMALIZATION_SHA}\` (source ref: \`${SOURCE_REF}\`). The private Verso CI must build and render successfully before merge.")
          fi
          # Events emitted with GITHUB_TOKEN do not recursively trigger the
          # pull_request workflow, so explicitly dispatch CI on the PR head.
          dispatch_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for attempt in {1..60}; do
            run_id=$(gh run list \
              --workflow ci.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\" and .createdAt >= \"$dispatch_started\") | .databaseId" |
              head -n 1)
            if test -n "$run_id"; then
              break
            fi
            sleep 5
          done
          if test -z "$run_id"; then
            echo "Could not locate the dispatched private CI run." >&2
            exit 1
          fi
          while true; do
            status=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq .status)
            if test "$status" = completed; then
              conclusion=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq .conclusion)
              if test "$conclusion" != success; then
                echo "Private CI run $run_id concluded with $conclusion." >&2
                exit 1
              fi
              break
            fi
            case "$status" in
              queued|in_progress|pending|requested|waiting) ;;
              *)
                echo "Private CI run $run_id has unexpected status $status." >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          current_public_main=$(gh api \
            "repos/$FORMALIZATION_REPO/git/ref/heads/main" \
            --jq .object.sha)
          if test "$FORMALIZATION_SHA" != "$current_public_main"; then
            echo "::error::Public main advanced to $current_public_main before merge."
            exit 1
          fi
          gh pr merge "$pr_url" --match-head-commit "$head_sha" --auto --squash
