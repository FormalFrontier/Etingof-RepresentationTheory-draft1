name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bootstrap the generated Lake manifest
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" update
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Check release legal filenames
        run: |
          test -f LICENSE
          test ! -e LICENCE
          test -f NOTICE
      # The aligned Verso repository pins this repository as a Lake dependency and
      # would otherwise recompile every module here. `enableArtifactCache` in
      # lakefile.toml populates the Lake artifact cache during the build above, so
      # recording the mappings now is a no-op rebuild that only reads them back.
      - name: Record the artifact cache mappings
        run: lake build -o outputs.jsonl RepresentationTheory alignmentExport
      - name: Stage the formalization artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          lake cache stage outputs.jsonl staging
          tar --create --gzip \
            --file "formalization-$GITHUB_SHA.tar.gz" staging
          size="$(stat -c %s "formalization-$GITHUB_SHA.tar.gz")"
          echo "Staged payload: $size bytes"
          # A GitHub release asset must stay below 2 GiB.
          if test "$size" -ge 2147483648; then
            echo "::error::Staged payload exceeds the 2 GiB release asset limit."
            exit 1
          fi
          sha256sum "formalization-$GITHUB_SHA.tar.gz" \
            > "formalization-$GITHUB_SHA.tar.gz.sha256"
      - name: Hand the payload to the publish job
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: formalization-payload-${{ github.sha }}
          path: |
            formalization-${{ github.sha }}.tar.gz
            formalization-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Separated from `build` so that repository write access is never available to
  # the checkout, the toolchain bootstrap, or any code the build executes.
  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: formalization-cache-publish
      cancel-in-progress: false
    steps:
      - name: Download the staged payload
        uses: actions/download-artifact@v4
        with:
          name: formalization-payload-${{ github.sha }}
      - name: Publish the formalization artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="formalization-$GITHUB_SHA.tar.gz"
          sha256sum --check "$asset.sha256"
          if ! gh release view formalization-cache >/dev/null 2>&1; then
            gh release create formalization-cache \
              --title "Formalization artifact cache" \
              --notes "Lake artifact cache payloads consumed by the aligned Verso repository. One asset per \`main\` revision; not a source release." \
              --latest=false ||
              gh release view formalization-cache >/dev/null
          fi
          # Assets are immutable: a revision's payload is uploaded once. A rerun
          # of an already published revision must not replace artifacts that the
          # private repository may already have pinned.
          if gh release view formalization-cache \
              --json assets --jq '.assets[].name' | grep -qxF "$asset"; then
            echo "Artifacts for $GITHUB_SHA are already published; leaving them untouched."
            exit 0
          fi
          gh release upload formalization-cache "$asset" "$asset.sha256"
