name: Notify aligned Verso repository

on:
  workflow_run:
    workflows: [Lean CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the tested formalization revision
        env:
          DISPATCH_TOKEN: ${{ secrets.VERSO_REPO_DISPATCH_TOKEN }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch || github.ref }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "VERSO_REPO_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mathlib-initiative/EtingofRepresentationTheory-verso/dispatches \
            --data "{\"event_type\":\"formalization-updated\",\"client_payload\":{\"sha\":\"$REVISION\",\"ref\":\"$SOURCE_REF\"}}"
