name = "EtingofRepresentationTheory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["EtingofRepresentationTheory"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Lean v4.29 made `isDefEq` respect transparency; restore the prior behavior
# project-wide (Mathlib's own v4.29 bump applies this flag per-declaration).
# `weak.` keeps it harmless on toolchains where the option is absent.
weak.backward.isDefEq.respectTransparency = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0-rc4"

[[lean_lib]]
name = "EtingofRepresentationTheory"
